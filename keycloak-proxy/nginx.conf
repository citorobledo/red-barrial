# Mismo Keycloak, dos puertos (ADR-14):
#   8080 -> red local: la consola de administración (/admin) está bloqueada.
#   8081 -> publicado solo en 127.0.0.1 del servidor: acceso completo.
#
# Importante: los proxy_set_header se declaran dentro de cada "location /"
# (un location que declara alguno pierde los heredados del server).

resolver 127.0.0.11 valid=10s;   # DNS interno de Docker: tolera reinicios de Keycloak

server {
    listen 8080;
    server_name _;

    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;

    location ~ ^/admin(/|$) {
        return 403;
    }

    location / {
        set $keycloak http://keycloak:8080;
        proxy_pass $keycloak;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}

server {
    listen 8081;
    server_name _;

    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;

    location / {
        set $keycloak http://keycloak:8080;
        proxy_pass $keycloak;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
